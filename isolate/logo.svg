<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="freecall-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="freecall-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square gradient tile matching the app's btn-gradient -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#freecall-bg)"/>

  <!-- Glass shine from the top -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#freecall-shine)"/>

  <!-- Subtle inner edge highlight -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Phone handset (white, centered) -->
  <g transform="translate(52,52) scale(17)" fill="#ffffff">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
  </g>

  <!-- Sound waves — free calls -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 384 230 A 26 26 0 0 1 384 282"/>
    <path d="M 384 208 A 48 48 0 0 1 384 304"/>
  </g>
</svg>
